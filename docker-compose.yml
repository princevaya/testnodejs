services:
  app:
    build: .
    container_name: testnodejs-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-testnodejs}
      DB_PASSWORD: ${DB_PASSWORD:-testnodejs_password}
      DB_NAME: ${DB_NAME:-testnodejs}
      PORT: 5000
      UPLOAD_DIR: uploads
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  db:
    image: mysql:8.0
    container_name: testnodejs-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-testnodejs}
      MYSQL_USER: ${DB_USER:-testnodejs}
      MYSQL_PASSWORD: ${DB_PASSWORD:-testnodejs_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  uploads_data: